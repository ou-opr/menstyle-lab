    <meta property="og:description" content="个性化造型推荐 + 3D 试衣间 + 穿搭建议引擎 + 全网博主资源，一站式男士穿搭指南。" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary" />
    <script>
      // 主题防闪烁（FOUC）：必须在样式表与 React 之前同步执行，否则会先亮后暗闪一下。
      // 与 src/components/ThemeToggle.jsx 的 initTheme() 读同一个键、同一套判据，幂等。
      (function () {
        try {
          var m = localStorage.getItem('stylelab:theme');
          if (m !== 'light' && m !== 'dark') m = 'auto';
          var dark = m === 'dark' || (m === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.themeMode = m;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 启动诊断：捕获渲染期报错并显示（正常情况下永不出现）
      window.__bootErrs = [];
      function __showBootErr() {
        var el = document.getElementById('boot-err');
        if (el) { el.textContent = window.__bootErrs.join('\n'); el.style.display = 'block'; }
      }
      window.addEventListener('error', function (e) {
        var m = (e && (e.message || e.type)) || 'unknown error';
        window.__bootErrs.push(m + '  @ ' + String(e.filename || '').slice(-44) + ':' + (e.lineno || '?'));
        __showBootErr();
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        window.__bootErrs.push('PROMISE ' + String((r && r.message) || r).slice(0, 300));
        __showBootErr();
      });
      // file:// 直接双击打开常规构建产物时，浏览器会静默拦截模块脚本：3 秒后仍空白则给出提示
      setTimeout(function () {
        var root = document.getElementById('root');
        if (location.protocol === 'file:' && root && root.children.length === 0) {
          var el = document.getElementById('boot-err');
          el.style.display = 'block';
          el.textContent = '检测到你是直接双击打开的本文件（file:// 协议）。\n'
            + '浏览器的安全策略会拦截这种打开方式的模块脚本，因此页面空白。\n'
            + '两种正确打开方式：\n'
            + '  1. 双击打开「单文件版」HTML（dist-single 目录里的文件，或 D:\\穿搭\\型格穿搭实验室-双击打开.html）；\n'
            + '  2. 在 style-lab 目录运行 npm run dev，然后浏览器访问 http://localhost:5173';
        }
      }, 3000);
    </script>
    <pre id="boot-err" style="display:none;position:fixed;bottom:0;left:0;right:0;max-height:32vh;overflow:auto;background:#2b1a12;color:#ffb4a0;font:12px/1.6 monospace;padding:10px 14px;white-space:pre-wrap;z-index:99999"></pre>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
